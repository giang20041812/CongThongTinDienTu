services:
  db:
    image: postgres:15-alpine
    container_name: portal_postgres
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: portal_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      # Local Postgres container: server-side prepared statements are fine here.
      DB_PREPARE_THRESHOLD: 5
      # Required in production: >= 32 random characters, keeps admin sessions valid across restarts.
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-}
      # Browser origins allowed to call the API directly (nginx serves the site same-origin).
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
