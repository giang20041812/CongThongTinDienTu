# Local stack: PostgreSQL + the portal (website and API in one Node container) on http://localhost.
# `docker compose up db` alone gives a database for `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    container_name: portal_postgres
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: portal_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: portal_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      # Required in production: >= 32 random characters, keeps admin sessions valid across restarts.
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
