spring:
  config:
    import: optional:file:.env[.properties], optional:file:backend/.env[.properties], optional:file:CongThongTinDienTu/backend/.env[.properties]
  datasource:
    # prepareThreshold=0: the Supabase pooler (transaction mode, port 6543) cannot keep server-side
    # prepared statements, which caused random 500s ("prepared statement S_1 already exists").
    # A direct PostgreSQL connection may set DB_PREPARE_THRESHOLD=5 (driver default).
    # ApplicationName labels these connections in pg_stat_activity, so the portal can be told apart
    # from other clients of the same database.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal_db}?prepareThreshold=${DB_PREPARE_THRESHOLD:0}&ApplicationName=${DB_APP_NAME:portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    # Entity graphs load every association the JSON needs; OSIV stays on only as a safety net.
    open-in-view: true
    hibernate:
      # The schema is owned by Liquibase (db/changelog); Hibernate only checks the mapping matches it.
      ddl-auto: ${DDL_AUTO:validate}
    # Logging every statement to stdout is slow; enable with SQL_LOG=true when debugging.
    show-sql: ${SQL_LOG:false}
    properties:
      hibernate:
        format_sql: ${SQL_LOG:false}
        # Any lazy association that still slips through is loaded in batches, not one query per row.
        default_batch_fetch_size: 32
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      # Images are capped at 5 MB in ImageUploadController; document attachments at 10 MB.
      max-file-size: 10MB
      max-request-size: 11MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}
server:
  port: 8080
  # Behind nginx: honour X-Forwarded-* only from private-network proxies, so same-origin
  # admin requests aren't mistaken for CORS requests and login throttling sees the real client IP.
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024
app:
  auth:
    # Set APP_AUTH_SECRET (>= 32 chars) in production so admin tokens survive restarts.
    secret: ${APP_AUTH_SECRET:}
    token-ttl-hours: ${APP_AUTH_TTL_HOURS:8}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,https://congthongtindientu.pages.dev}
  cache:
    # Public listings are served from memory for this long; admin writes clear it immediately.
    ttl-seconds: ${APP_CACHE_TTL:60}
