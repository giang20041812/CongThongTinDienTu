databaseChangeLog:
  - changeSet:
      id: v2-02-schema
      author: portal
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                  id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  username      VARCHAR(50)  NOT NULL UNIQUE,
                  password_hash VARCHAR(255) NOT NULL,
                  role          VARCHAR(20)  NOT NULL DEFAULT 'ADMIN',
                  created_at    TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              -- Menu tree: parent_id NULL = top-level heading; at most two levels (enforced by the API).
              CREATE TABLE categories (
                  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  parent_id    UUID REFERENCES categories(id),
                  name         VARCHAR(100) NOT NULL,
                  slug         VARCHAR(100) NOT NULL UNIQUE,
                  page_type    VARCHAR(30)  NOT NULL DEFAULT 'POST_LIST',
                  sort_order   INTEGER      NOT NULL DEFAULT 0,
                  visible      BOOLEAN      NOT NULL DEFAULT TRUE,
                  show_on_home BOOLEAN      NOT NULL DEFAULT FALSE,
                  external_url VARCHAR(500),
                  description  TEXT,
                  created_at   TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at   TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX idx_categories_parent ON categories (parent_id, sort_order);

              CREATE TABLE posts (
                  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  title           VARCHAR(500) NOT NULL,
                  slug            VARCHAR(255) NOT NULL UNIQUE,
                  category_id     UUID NOT NULL REFERENCES categories(id),
                  author_id       UUID NOT NULL REFERENCES users(id),
                  summary         TEXT,
                  cover_url       TEXT,
                  status          VARCHAR(20) NOT NULL DEFAULT 'PUBLISHED',
                  pinned          BOOLEAN     NOT NULL DEFAULT FALSE,
                  views           INTEGER     NOT NULL DEFAULT 0,
                  published_at    TIMESTAMP   NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  document_number VARCHAR(255),
                  issuer          VARCHAR(255),
                  issued_date     DATE,
                  recipient       VARCHAR(255),
                  action_required TEXT,
                  search_text     TEXT,
                  created_at      TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at      TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              -- Listings filter by category + status and sort pinned first, newest first.
              CREATE INDEX idx_posts_category_listing ON posts (category_id, status, pinned DESC, published_at DESC);
              CREATE INDEX idx_posts_listing ON posts (status, pinned DESC, published_at DESC);

              CREATE TABLE post_blocks (
                  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  post_id     UUID NOT NULL REFERENCES posts(id) ON DELETE CASCADE,
                  type        VARCHAR(20) NOT NULL,
                  content     TEXT,
                  image_url   TEXT,
                  order_index INTEGER NOT NULL
              );
              CREATE INDEX idx_post_blocks_post ON post_blocks (post_id, order_index);

              CREATE TABLE post_attachments (
                  id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  post_id    UUID NOT NULL REFERENCES posts(id) ON DELETE CASCADE,
                  name       VARCHAR(255) NOT NULL,
                  url        TEXT NOT NULL,
                  size_bytes BIGINT,
                  mime_type  VARCHAR(255),
                  sort_order INTEGER NOT NULL
              );
              CREATE INDEX idx_post_attachments_post ON post_attachments (post_id, sort_order);

              CREATE TABLE schedules (
                  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  title           VARCHAR(255) NOT NULL,
                  description     TEXT,
                  start_time      TIMESTAMP NOT NULL,
                  end_time        TIMESTAMP NOT NULL,
                  location        VARCHAR(255),
                  type            VARCHAR(50),
                  related_user_id UUID REFERENCES users(id),
                  created_at      TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX idx_schedules_start ON schedules (start_time);

              CREATE TABLE feedbacks (
                  id         UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  full_name  VARCHAR(100) NOT NULL,
                  email      VARCHAR(150),
                  phone      VARCHAR(20),
                  subject    VARCHAR(200),
                  content    TEXT NOT NULL,
                  status     VARCHAR(20) NOT NULL DEFAULT 'NEW',
                  note       TEXT,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX idx_feedbacks_created ON feedbacks (created_at DESC);

              CREATE TABLE site_settings (
                  setting_key   VARCHAR(50) PRIMARY KEY,
                  setting_value TEXT
              );
