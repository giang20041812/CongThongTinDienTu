databaseChangeLog:
  - changeSet:
      id: 04-add-tracking-fields
      author: admin
      changes:
        - addColumn:
            tableName: posts
            columns:
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: status
                  type: varchar(255)
                  defaultValue: "PUBLISHED"
              - column:
                  name: views
                  type: integer
                  defaultValue: 0
        - addColumn:
            tableName: announcements
            columns:
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: status
                  type: varchar(255)
                  defaultValue: "PUBLISHED"
              - column:
                  name: views
                  type: integer
                  defaultValue: 0
        - addColumn:
            tableName: lost_found_reports
            columns:
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: views
                  type: integer
                  defaultValue: 0
