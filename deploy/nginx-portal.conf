# Nginx: nhận HTTP/HTTPS và chuyển vào app Node ở 127.0.0.1:8080.
# setup-vps.sh chép file này vào /etc/nginx/sites-available/portal và thay TEN_MIEN bằng tên miền thật;
# certbot --nginx sau đó tự thêm phần HTTPS (cổng 443) và chuyển hướng HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name TEN_MIEN www.TEN_MIEN;

    # Admin tải ảnh ≤ 5 MB, tệp đính kèm ≤ 10 MB; mặc định của Nginx chỉ 1 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # App lấy IP thật của người dùng từ đây (giới hạn góp ý / đăng nhập sai tính theo IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
